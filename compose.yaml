services:
  vf-kapo:
    build:
      context: .
    image: vf-kapo-pi:0.1.0
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
      DATABASE_PATH: /data/vf-kapo.sqlite
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - vf-kapo-data:/data
    secrets:
      - github_app_private_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vf-kapo-data:

secrets:
  github_app_private_key:
    file: ./secrets/github-app.pem
